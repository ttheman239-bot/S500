name: Build Android APK

on:
  push:
    branches:
      - claude/android-stock-analysis-app-JpPPa
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK"
          cp "$APK" "S500-Drivers-debug.apk"
          echo "apk_path=S500-Drivers-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S500-Drivers-debug-apk
          path: S500-Drivers-debug.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: S&P 500 Drivers v1.0.${{ github.run_number }}
          body: |
            แอปวิเคราะห์ S&P 500 — บอกว่าหุ้นไหนกำลังผลักดัน / ฉุดดัชนี
            พร้อม rolling window (1d / 1W / 2W / 1M / 3M / 6M)

            ### ฟีเจอร์
            - **Drivers / Draggers**: % ของขนาดการเคลื่อนไหวของดัชนีที่หุ้นแต่ละตัวรับผิดชอบ
            - **Streak**: หุ้นไหนผลักดันต่อเนื่องมาแล้วกี่วัน
            - **Flip**: หุ้นที่เคยฉุดในรอบสัปดาห์ที่แล้ว → กลับมาผลักดันวันนี้ (มักมีข่าว)
            - **News-likely**: หุ้นที่ขยับ >2.5σ — เกือบทุกครั้งหมายถึงมีข่าวสด
            - กราฟ SPX แบบ pinch-zoom + crosshair

            ### วิธีติดตั้ง
            1. ดาวน์โหลดไฟล์ `S500-Drivers-debug.apk` ด้านล่าง
            2. เปิดบนมือถือ Android (อาจต้องอนุญาต "Install unknown apps")
            3. กดติดตั้ง

            ข้อมูล: Barchart.com (EOD daily) สำหรับทั้ง SPX และ top 50 constituents
          files: S500-Drivers-debug.apk
          make_latest: true
